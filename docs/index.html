<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Progressive Web App PSB Fathan Mubina">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.svg" type="image/svg+xml">
  <title>PSB Fathan Mubina</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;min-height:100%;background:#f7f7fa}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f7fa}
    .boot-card{width:min(92vw,380px);padding:28px 22px;text-align:center;background:#fff;border:1px solid #e8e3ee;border-radius:22px;box-shadow:0 10px 30px rgba(45,31,75,.08)}
    .boot-logo{width:72px;height:72px;margin:0 auto 16px;border-radius:20px;object-fit:cover;background:#f2edff}
    .boot-title{margin:0;color:#211c28;font-size:19px;font-weight:800}
    .boot-text{margin:8px 0 18px;color:#756d7d;font-size:13px;line-height:1.5}
    .boot-link{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 18px;border-radius:12px;background:#4f46e5;color:#fff;text-decoration:none;font-size:14px;font-weight:800;border:0;cursor:pointer}
    .boot-note{margin:14px 0 0;color:#8b8491;font-size:11px;line-height:1.45}
  </style>
</head>
<body>
  <main class="boot">
    <section class="boot-card" aria-live="polite">
      <img class="boot-logo" id="bootLogo" src="./assets/icons/icon-192.svg" alt="PSB Fathan Mubina">
      <h1 class="boot-title">PSB Fathan Mubina</h1>
      <p class="boot-text">Membuka aplikasi PSB...</p>
      <a class="boot-link" id="openApp" href="#">Buka Aplikasi PSB</a>
      <p class="boot-note">Aplikasi PSB berjalan langsung melalui Google Apps Script agar login dan seluruh fungsi aplikasi tetap bekerja normal.</p>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
