<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PSB Fathan Mubina — API Bridge</title>
  <style>html,body{margin:0;width:100%;height:100%;background:transparent}#status{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}</style>
</head>
<body>
<div id="status" aria-hidden="true">PSB API Bridge</div>
<script>
(() => {
  'use strict';
  const BRIDGE_SOURCE='psb-fm-api-bridge';
  const BRIDGE_VERSION='32.3.5';
  const PWA_SOURCE='psb-fm-pwa';
  let allowedOrigins=[], ready=false;
  // Apps Script HTML Service dapat membungkus Bridge dalam browsing context
  // provider. Gunakan window.top sebagai jalur komunikasi ke PWA host.
  const topWindow=()=>{try{return window.top||window.parent}catch(e){return window.parent}};
  const postToPwa=(targetOrigin,payload)=>{
    const origin=String(targetOrigin||'').trim();
    if(!origin||origin==='*')return false;
    try{topWindow().postMessage(Object.assign({source:BRIDGE_SOURCE},payload),origin);return true}catch(e){return false}
  };
  const normalizeOrigin = value => {
    try {
      const u = new URL(String(value || '').trim());
      if (u.protocol !== 'https:' || u.username || u.password || u.pathname !== '/' || u.search || u.hash) return '';
      return u.origin;
    } catch (e) {
      return '';
    }
  };
  const originAllowed=origin=>{
    const candidate=normalizeOrigin(origin);
    return !!candidate && allowedOrigins.includes(candidate);
  };
  const announceReady=()=>{
    if(ready||!allowedOrigins.length)return;
    ready=true;
    allowedOrigins.forEach(origin=>postToPwa(origin,{type:'ready',bridgeVersion:BRIDGE_VERSION}));
  };
  google.script.run.withSuccessHandler(cfg=>{
    allowedOrigins=Array.isArray(cfg&&cfg.allowedOrigins)
      ? [...new Set(cfg.allowedOrigins.map(normalizeOrigin).filter(Boolean))]
      : [];
    announceReady();
  }).withFailureHandler(()=>{allowedOrigins=[]}).getPwaBridgeConfig();
  window.addEventListener('message',event=>{
    if(!originAllowed(event.origin))return;
    const data=event.data||{};
    if(data.source!==PWA_SOURCE||data.type!=='request')return;

    // Request harus benar-benar berasal dari halaman induk PWA yang
    // meng-embed bridge ini. Origin saja tidak cukup untuk mengikat
    // pengirim ke frame yang sah.
    const parentWindow=topWindow();
    if(event.source!==parentWindow)return;

    const id=String(data.id||'').trim();
    const fn=String(data.fn||'').trim();
    const args=Array.isArray(data.args)?data.args:[];
    if(!/^pwa_[a-z0-9]+_[a-z0-9]+$/i.test(id) || id.length>100)return;
    if(!/^[A-Za-z_$][A-Za-z0-9_$]{0,99}$/.test(fn))return;
    if(args.length>50){
      postToPwa(event.origin,{type:'response',id,ok:false,error:{code:'BRIDGE_ARGS_LIMIT','message':'Jumlah argumen API melebihi batas.'}});
      return;
    }
    if(!ready){
      postToPwa(event.origin,{type:'response',id,ok:false,error:{code:'BRIDGE_NOT_READY',message:'API bridge belum siap.'}});
      return;
    }
    google.script.run.withSuccessHandler(result=>{
      postToPwa(event.origin,{type:'response',id,ok:true,result});
    }).withFailureHandler(err=>{
      postToPwa(event.origin,{type:'response',id,ok:false,error:{code:'RPC_ERROR',message:String(err&&err.message||'Terjadi kesalahan komunikasi dengan backend.')}});
    }).pwaBridgeCall(fn,args);
  });
})();
</script>
</body>
</html>
